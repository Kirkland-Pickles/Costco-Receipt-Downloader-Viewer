  function quantityDisplay(i){const q=Math.abs(i.qty)||1,unit=Math.abs(i.unitPrice),base=Math.abs(i.originalAmount);if(i.adjustment)return 'Adjustment';if(unit>0&&Math.abs(q*unit-base)<.05)return `${q} × ${money(unit,i.currency)}`;if([63,12,13,19,14,34].includes(i.dept)&&unit>0&&Math.abs(base-unit)>.02){const weight=base/unit,measure=i.currency==='CAD'?'kg':'lb';return `${weight.toFixed(2)} ${measure}`;}return `${q} unit${q===1?'':'s'}`;}

  function receiptKey(r){

  function basketComparison(r){

      const metric=unitMetric(item);if(!metric||!Number.isFinite(metric.price)||metric.price<=0)continue;
      const sku=String(item.itemNumber);if(!observations.has(sku))observations.set(sku,[]);

      const metric=unitMetric(i),obs=(observations.get(String(i.itemNumber))||[]).filter(o=>metric&&o.measure===metric.measure).sort((a,b)=>a.day.localeCompare(b.day));

      <div class="basket-metrics"><div><span>Paid on receipt</span><strong>${esc(money(r.total))}</strong></div><div><span>At lowest recorded prices</span><strong>${esc(money(min))}</strong></div><div><span>At highest recorded prices</span><strong>${esc(money(max))}</strong></div></div>
      ${perMonth.length?`<h3>Cost by historical month</h3><div class="insight-scroll"><table class="analysis-table"><thead><tr><th>Month</th><th>Estimated basket</th><th>Price matches</th></tr></thead><tbody>${perMonth.map(m=>`<tr><td>${esc(m.month)}</td><td>${esc(money(m.total))}</td><td>${m.observed}/${covered.length}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">More purchase dates are needed for a price comparison.</p>'}

  function code128Svg(value){
    const digits=String(value||'').trim();
    if(!/^\d{4,60}$/.test(digits))return '';
    const odd=digits.length%2===1,codes=odd?[104,Number(digits[0])+16,99]:[105];
    for(let i=odd?1:0;i<digits.length;i+=2)codes.push(Number(digits.slice(i,i+2)));
    let check=codes[0];for(let i=1;i<codes.length;i++)check+=codes[i]*i;
    codes.push(check%103,106);
    const bars=[];let x=10;
    for(const code of codes){const pattern=CODE128_PATTERNS[code];for(let j=0;j<pattern.length;j++){const width=Number(pattern[j]);if(j%2===0)bars.push('<rect x="'+x+'" y="0" width="'+width+'" height="48"/>');x+=width;}}
    return '<svg class="receipt-barcode" viewBox="0 0 '+(x+10)+' 48" role="img" aria-label="Code 128 barcode for '+esc(digits)+'" xmlns="http://www.w3.org/2000/svg">'+bars.join('')+'</svg>';
  }


  function receiptAmount(value){const n=num(value);return Math.abs(n).toFixed(2)+(n<-.0001?'-':'');}
  function slipLine(label,amount,kind=''){
    return `<div class="slip-line ${kind}"><span>${esc(label)}</span><span>${esc(receiptAmount(amount))}</span></div>`;
  }
  function receiptStamp(r){
    const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(r.date);
    return m?`${m[2]}/${m[3]}/${m[1]} ${String(r.date).slice(11,16)}`:String(r.date||'');
  }
  function receiptPaper(r,highlight=''){
    const raw=r.raw||{},wh=raw.warehouseShortName||raw.warehouseName||r.warehouse;
    const taxCodes=new Set(['a','b','c','d']);
    const term=String(highlight||'').trim().toLowerCase();
    const itemMarkup=objects(raw.itemArray).map(item=>{
      const desc=String(item.description||item.itemDescription01||item.itemDescription02||'ITEM').trim();
      const sku=item.itemNumber==null?'':String(item.itemNumber);
      const adjusted=state.itemNames[sku],label=adjusted||desc;
      const tax=item.taxFlag==null||String(item.taxFlag).toUpperCase()==='N'?'':String(item.taxFlag);
      const match=term&&[desc,sku,label,item.itemDescription02].some(v=>String(v||'').toLowerCase().includes(term));
      const quantity=num(item.unit),unitCost=num(item.itemUnitPriceAmount);
      const isAdjustment=/^(CPN|MVM|TPD|COUPON|DISCOUNT)\s*\/?/i.test(desc)||num(item.amount)<0&&!r.refund;
      const quantityLine=!isAdjustment&&quantity>0&&Math.abs(quantity-1)>.001&&unitCost>0;
      const canOpen=!isAdjustment&&sku&&state.items.some(i=>i.itemNumber===sku&&i.currency===r.currency&&!i.adjustment&&!i.refund);
      const tag=canOpen?'button':'div';const attributes=canOpen?` type="button" data-action="history" data-item="${esc(sku)}" aria-label="Price history for ${esc(label)}"`:'';
      return `<${tag} class="slip-item ${canOpen?'slip-product':''} ${match?'slip-match':''} ${isAdjustment?'slip-adjustment':''}"${attributes} title="${esc(adjusted?desc:canOpen?'View price history':item.itemDescription02||'')}"><span class="slip-tax-code"></span><span class="slip-sku">${esc(sku)}</span><span class="slip-description">${esc(label)}</span><span class="slip-price">${esc(receiptAmount(item.amount))}${tax?` <small>${esc(tax)}</small>`:''}</span></${tag}>${quantityLine?`<div class="slip-quantity">${esc(quantity)} @ ${esc(receiptAmount(unitCost))}</div>`:''}`;
    }).join('');
    const sourceIds=new Set(objects(raw.itemArray).map(i=>String(i.itemNumber)));
    const couponMarkup=objects(raw.couponArray).filter(c=>!sourceIds.has(String(c.couponNumber))).map(c=>`<div class="slip-item slip-adjustment"><span class="slip-tax-code"></span><span class="slip-sku">${esc(c.couponNumber||'')}</span><span class="slip-description">${esc('/'+(c.associatedItemNumber&&String(c.associatedItemNumber)!=='0'?c.associatedItemNumber:'COUPON'))}</span><span class="slip-price">${esc(receiptAmount(c.amountCoupon))}</span></div>`).join('');
    const taxParts=[];
    if(raw.subTaxes&&!Array.isArray(raw.subTaxes))for(const p of taxCodes){
      const t=raw.subTaxes,v=t[p+'TaxAmount'];
      if(v!=null&&Math.abs(num(v))>.0001)taxParts.push(slipLine(`${p.toUpperCase()}  ${t[p+'TaxPercent']!=null?num(t[p+'TaxPercent']).toFixed(2)+'% ':''}${t[p+'TaxLegend']||'TAX'}`,v));
    }
    if(!taxParts.length)taxParts.push(slipLine('TAX',r.tax));
    const tenderRows=objects(raw.tenderArray).filter(t=>Math.abs(num(t.amountTender))>.005);
    const tenders=tenderRows.map(t=>{
      const type=String(t.tenderTypeName||t.tenderDescription||t.tenderTypeCode||'TENDER');
      const card=t.displayAccountNumber&&!/cash|change/i.test(type)?` ${masked(t.displayAccountNumber)}`:'';
      return slipLine(type+card,t.amountTender);
    }).join('');
    const tenderDetail=tenderRows.map(t=>{
      const info=[['AID',t.aid||t.applicationIdentifier],['Seq',t.sequenceNumber],['App#',t.approvalNumber||t.tenderAuthorizationCode],['Tran ID#',t.transactionID],['Entry',t.tenderEntryMethodDescription||t.entryMethod]]
        .filter(([,value])=>value!=null&&String(value).trim()).map(([k,v])=>`${k}: ${v}`);
      const response=String(t.responseCode||'');if(response)info.push(`Resp: ${response}`);
      return info.length?`<div class="slip-authorization">${info.map(line=>`<div>${esc(line)}</div>`).join('')}</div>`:'';
    }).join('');
    const itemCount=raw.totalItemCount!=null?num(raw.totalItemCount):r.items.filter(i=>!i.adjustment).length;
    const savings=raw.instantSavings!=null?num(raw.instantSavings):r.savings;
    const originFields=[['Warehouse',raw.warehouseNumber],['Terminal',raw.registerNumber],['Transaction',raw.transactionNumber],['Operator',raw.operatorNumber]].filter(([,v])=>v!==null&&v!==undefined&&v!=='');
    const origin=originFields.map(([,v])=>v).join('  ');
    const originHelp=originFields.map(([label,value])=>label+': '+value).join(' · ');
    const address=[raw.warehouseAddress1,raw.warehouseAddress2].filter(Boolean);
    const city=[raw.warehouseCity,[raw.warehouseState,raw.warehousePostalCode].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    const memberType=String(raw.membershipType||raw.membershipTypeCode||'');
    return `<div class="slip" aria-label="Costco receipt from ${esc(wh)} on ${esc(shortDate(r.date))}">
      <div class="slip-logo" aria-label="Costco Wholesale">${COSTCO_LOGO}</div>
      <div class="slip-center slip-location">${esc(wh)}${raw.warehouseNumber!=null?' #'+esc(raw.warehouseNumber):''}</div>
      ${address.map(line=>`<div class="slip-center slip-address">${esc(line)}</div>`).join('')}
      ${city?`<div class="slip-center slip-address">${esc(city)}</div>`:''}
      ${r.refund?'<div class="slip-event">RETURN</div>':''}
      ${r.member?`<div class="slip-member">${esc(memberType||'')} Member ${esc(r.member)}${state.memberNames[r.member]?`<span class="slip-alias">${esc(state.memberNames[r.member])}</span>`:''}</div>`:''}
      <div class="slip-items">${itemMarkup}${couponMarkup}</div>
      <div class="slip-totals">
        ${raw.subTotal!=null?slipLine('SUBTOTAL',raw.subTotal):''}
        ${slipLine('TAX',r.tax)}
        ${slipLine('**** TOTAL',r.total,'slip-grand')}
      </div>
      ${tenders?`<div class="slip-payment">${tenderDetail}${tenders}${tenderRows.some(t=>/approved/i.test(String(t.tenderAuthorizationResponse||t.authorizationResponse||'')))?'<div class="slip-approval">APPROVED - Purchase</div>':''}</div>`:''}
      <div class="slip-center slip-datetime" title="${esc(originHelp)}">${esc(receiptStamp(r))}${origin?'  '+esc(origin):''}</div>
      ${r.barcode?`<div class="slip-barcode-wrap">${code128Svg(r.barcode)}<div class="slip-center slip-barcode-number">${esc(r.barcode)}</div></div>`:''}
      ${raw.operatorNumber!=null?`<div class="slip-center slip-operator" title="Operator (cashier) number">OP#: ${esc(raw.operatorNumber)}${raw.operatorName?` Name: ${esc(raw.operatorName)}`:''}</div>`:''}
      <div class="slip-center slip-thanks">Thank You! Please Come Again</div>
      <div class="slip-statistics"><div class="slip-center">Items Sold: ${esc(itemCount)}</div>${savings>0?`<div class="slip-center">INSTANT SAVINGS $ ${esc(receiptAmount(savings))}</div>`:''}${memberType?`<div class="slip-center slip-bottom-stamp">${esc(memberType)} ${esc(receiptStamp(r))}</div>`:''}</div>
    </div>`;
  }
  function reviewConflicts(){
    modal(`<h2 id="modalTitle">Conflicting imports</h2><div class="sub">Receipts with matching transaction IDs but different totals. The first version is used for calculations; both original versions are kept in backups.</div>
      <div class="modal-list">${state.importConflicts.slice(0,25).map((entry,i)=>`<details class="conflict"><summary>${i+1}. ${esc(entry.identity)} · ${esc(money(entry.original?.total))} / ${esc(money(entry.incoming?.total))}</summary><div class="conflict-columns"><section><h3>First</h3><pre class="raw-json">${esc(JSON.stringify(entry.original,null,2))}</pre></section><section><h3>Incoming</h3><pre class="raw-json">${esc(JSON.stringify(entry.incoming,null,2))}</pre></section></div></details>`).join('')}</div>
      ${state.importConflicts.length>25?`<p class="data-note">First 25 shown. All ${state.importConflicts.length} versions are included in Backup.</p>`:''}
      <div class="modal-actions"><button class="btn primary" data-action="close-modal">Close</button></div>`);
  }
  function printReceipt(id){
    const r=sourceReceipt(id);if(!r)return;
    $('printHost').innerHTML=receiptPaper(r);
    window.print();
  }

  function modal(html){$('modalContent').innerHTML=html;$('modalOverlay').hidden=false;document.body.style.overflow='hidden';const focus=$('modalOverlay').querySelector('input,button');if(focus)focus.focus();}
  function closeModal(){$('modalOverlay').hidden=true;$('modalContent').replaceChildren();document.body.style.overflow='';}
  function rename(type,key){const map=type==='item'?state.itemNames:state.memberNames,original=type==='item'?(state.items.find(i=>String(i.itemNumber)===key)?.description||key):'Membership '+key;
    modal(`<h2 id="modalTitle">Rename ${type}</h2><div class="sub">${esc(original)}</div><label class="overline" for="renameValue">Display name</label><input class="input" id="renameValue" maxlength="80" style="display:block;width:100%;margin-top:8px" value="${esc(map[key]||'')}" placeholder="Add a friendly name"><div class="modal-actions"><button class="btn danger" data-action="reset-rename" data-type="${type}" data-key="${esc(key)}">Reset</button><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-rename" data-type="${type}" data-key="${esc(key)}">Save name</button></div>`);
  }
  function saveRename(type,key,reset=false){const map=type==='item'?state.itemNames:state.memberNames,value=reset?'':$('renameValue').value.trim();if(value)map[key]=value;else delete map[key];settingsSet(type==='item'?'ledger_item_names':'ledger_member_names',map);closeModal();populateOptions();renderAll();changed();toast(value?'Name saved':'Name reset');}
  function history(itemNumber){const related=state.items.filter(i=>String(i.itemNumber)===String(itemNumber)&&i.currency===state.currency&&!i.refund&&!i.adjustment).sort((a,b)=>a.date.localeCompare(b.date));if(!related.length){toast('No purchase history available.');return;}
    const cur=related[related.length-1].currency,items=related.filter(i=>i.currency===cur),name=itemName(related[related.length-1]);const prices=items.map(i=>{const base=Math.abs(i.originalAmount),q=Math.abs(i.qty)||1,u=Math.abs(i.unitPrice);if(u>0&&Math.abs(base-u*q)<.05)return Math.abs(i.netAmount)/q;if([63,12,13,19,14,34].includes(i.dept)&&u>0&&Math.abs(base-u)>.02)return Math.abs(i.netAmount)/(base/u);return Math.abs(i.netAmount)/q;});
    const last=items.slice(-12),lastPrices=prices.slice(-12),labels=last.map(i=>i.day.slice(5));
    modal(`<h2 id="modalTitle">${esc(name)}</h2><div class="sub">Item #${esc(itemNumber)} · ${items.length} purchase${items.length===1?'':'s'}</div><div class="surface" style="padding:15px;margin-bottom:15px"><div class="overline">Price history</div>${barChart(lastPrices,labels,cur,'Historical effective prices for '+name)}</div><div class="modal-list">${items.slice().reverse().map((i,j)=>`<div class="history-row"><span>${esc(shortDate(i.date))}</span><span>${esc(i.warehouse)}</span><span>${esc(money(prices[items.length-1-j],cur))}</span></div>`).join('')}</div><div class="modal-actions"><button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="rename-item" data-item="${esc(itemNumber)}">Rename product</button></div>`);
  }
  function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('IndexedDB unavailable'));const request=indexedDB.open('costco-ledger-offline',1);request.onupgradeneeded=()=>request.result.createObjectStore('archives');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
  async function dbValue(value){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('archives',value===undefined?'readonly':'readwrite');const store=tx.objectStore('archives');const req=value===undefined?store.get('current'):value===null?store.delete('current'):store.put(value,'current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}

  async function restoreArchive(){try{const saved=await dbValue();if(!saved||!saved.text)return;const result=ingest(saved.text,saved.name||'Saved archive');state.appDataHandle=saved.handle||null;renderAll();fileStatus(state.appDataHandle?'App data linked':'In browser · choose Save app data');toast(`Restored ${result.receipts} receipts.`);}catch{}}
  function eraseArchive(){if(!confirm('Clear this browser’s saved receipts, notes and preferences? Your app-data file will not be changed.'))return;clearTimeout(state.saveTimer);state.appDataHandle=null;state.sourceFileHandle=null;dbValue(null).catch(()=>{});state.rawRecords=[];state.importConflicts=[];state.receipts=[];state.items=[];state.itemNames={};state.memberNames={};state.receiptMeta={};state.selectedReceiptId=null;state.year='all';state.currency='USD';state.view='overview';state.source='';state.openSections=new Set();state.overviewPeriod='';state.itemMode='group';$('itemMode').value='group';settingsSet('ledger_item_names',{});settingsSet('ledger_member_names',{});settingsSet('ledger_receipt_meta',{});settingsSet('ledger_preferences',{});settingsSet('ledger_theme','light');settingsSet('ledger_last_receipt',null);document.documentElement.dataset.theme='light';$('themeIcon').setAttribute('href','#ic-moon');$('yearSelect').classList.add('hidden');$('currencySelect').classList.add('hidden');fileStatus('');renderAll();toast('Browser data cleared. Your file is unchanged.');}
  document.addEventListener('click',e=>{
    const nav=e.target.closest('[data-view]');if(nav){switchView(nav.dataset.view);return;}
    const go=e.target.closest('[data-go]');if(go){switchView(go.dataset.go);return;}
    const action=e.target.closest('[data-action]');if(action){const {action:kind,item,id,type,key}=action.dataset;
      if(kind==='select-receipt')selectReceipt(id);
      if(kind==='open-receipt'){switchView('receipts');selectReceipt(id);}
      if(kind==='clear-compare'){state.compareOpen=false;renderReceiptInspector();}
      if(kind==='save-receipt-note'){
        const note=document.getElementById('receiptNoteInput')?.value.trim().slice(0,1000)||'';
        updateReceiptAnnotation(id,{note});toast('Note saved.');
      }
      if(kind==='history')history(item);
      if(kind==='clear-period'){state.overviewPeriod='';renderOverview();}
      if(kind==='rename-member')rename('member',key);
      if(kind==='filter-period'){const period=action.dataset.period||'';state.overviewPeriod=state.overviewPeriod===period?'':period;renderOverview();}
      if(kind==='search-overview'){$('receiptSearch').value=$('overviewSearch')?.value||'';state.year='all';populateOptions();switchView('receipts');}
      if(kind==='review-conflicts')reviewConflicts();
      if(kind==='receipt-print')printReceipt(id);
      if(kind==='rename-item')rename('item',item);
      if(kind==='save-rename'||kind==='reset-rename')saveRename(type,key,kind==='reset-rename');
      if(kind==='close-modal')closeModal();return;
    }
    if(e.target.id==='moreReceipts'){state.receiptLimit+=50;renderReceipts();}
    if(e.target.id==='moreProducts'){state.productLimit+=75;renderProducts();}
    if(!e.target.closest('#dataMenu'))$('dataMenu').open=false;
  });
  document.addEventListener('toggle',e=>{if(e.target.matches?.('.ov-section')){const section=e.target.dataset.section;if(e.target.open)state.openSections.add(section);else state.openSections.delete(section);}},true);
  $('modalOverlay').addEventListener('click',e=>{if(e.target===$('modalOverlay'))closeModal();});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!$('modalOverlay').hidden){closeModal();return;}
    if(e.key==='Escape')$('dataMenu').open=false;
    if(e.key==='Enter'&&e.target.id==='renameValue')$('modalContent').querySelector('[data-action="save-rename"]')?.click();
    if(e.key==='Enter'&&e.target.id==='overviewSearch'){e.preventDefault();document.querySelector('[data-action="search-overview"]')?.click();}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="filter-period"]')){e.preventDefault();e.target.click();}
    if(!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)&&!document.activeElement?.isContentEditable&&$('modalOverlay').hidden){
      if(e.key==='/'&&state.receipts.length){e.preventDefault();$(state.view==='receipts'?'receiptSearch':state.view==='overview'?'overviewSearch':'productSearch').focus();}
      if(state.view==='receipts'&&e.key==='ArrowLeft'){e.preventDefault();stepReceipt(-1);}
      if(state.view==='receipts'&&e.key==='ArrowRight'){e.preventDefault();stepReceipt(1);}
    }
  });
  const theme=settingsGet('ledger_theme','light');document.documentElement.dataset.theme=theme==='dark'?'dark':'light';$('themeIcon').setAttribute('href',theme==='dark'?'#ic-sun':'#ic-moon');
  $('themeToggle').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('themeIcon').setAttribute('href',dark?'#ic-sun':'#ic-moon');settingsSet('ledger_theme',dark?'dark':'light');changed();});
  async function openImport(){
    if(window.showOpenFilePicker){try{const handles=await window.showOpenFilePicker({multiple:true,types:[{description:'Costco JSON',accept:{'application/json':['.json']}}]});for(const handle of handles)await loadFile(await handle.getFile(),handle);return;}catch(e){if(e?.name==='AbortError')return;}}
    $('fileInput').click();
  }
  for(const id of ['topImport','browseBtn'])$(id).addEventListener('click',openImport);
  $('saveAppData').addEventListener('click',saveAppData);
  $('fileInput').addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);e.target.value='';for(const file of files)await loadFile(file);});
  $('dropzone').addEventListener('keydown',e=>{if(e.target===$('dropzone')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('fileInput').click();}});
  $('dropzone').addEventListener('click',e=>{if(!e.target.closest('button'))$('fileInput').click();});
  for(const event of ['dragenter','dragover'])document.addEventListener(event,e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();$('dropzone').classList.add('is-drag');}});
  document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('dropzone').classList.remove('is-drag');});
  document.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length){e.preventDefault();$('dropzone').classList.remove('is-drag');loadFile(e.dataTransfer.files[0]);}});
  $('yearSelect').addEventListener('change',e=>{state.year=e.target.value;state.overviewPeriod='';state.receiptLimit=50;state.productLimit=75;renderAll();changed();});
  $('currencySelect').addEventListener('change',e=>{state.currency=e.target.value;state.year='all';state.overviewPeriod='';state.selectedReceiptId=null;state.compareOpen=false;state.receiptLimit=50;state.productLimit=75;resetInputs();populateOptions();renderAll();changed();});
  for(const id of ['receiptSearch','receiptWarehouse','receiptMember','dateFrom','dateTo','receiptSort'])$(id).addEventListener(id==='receiptSearch'?'input':'change',()=>{state.receiptLimit=50;renderReceipts();});
  document.querySelectorAll('[data-receipt-filter]').forEach(b=>b.addEventListener('click',()=>{state.receiptFilter=state.receiptFilter===b.dataset.receiptFilter?'':b.dataset.receiptFilter;document.querySelectorAll('[data-receipt-filter]').forEach(other=>other.setAttribute('aria-pressed',String(other.dataset.receiptFilter===state.receiptFilter)));state.receiptLimit=50;renderReceipts();}));
  for(const [id,step] of [['receiptPrev',-1],['receiptNext',1]])$(id).addEventListener('click',()=>stepReceipt(step));
  $('receiptStar').addEventListener('click',()=>{const r=sourceReceipt(state.selectedReceiptId);if(r)updateReceiptAnnotation(r.id,{starred:!receiptAnnotation(r).starred});});
  $('receiptCompare').addEventListener('click',()=>{state.compareOpen=!state.compareOpen;renderReceiptInspector();});
  $('receiptPrint').addEventListener('click',()=>printReceipt(state.selectedReceiptId));
  $('receiptFind').addEventListener('input',e=>{state.receiptFind=e.target.value;renderReceiptInspector();});
  for(const id of ['productSearch','productWarehouse','productMember','productSort'])$(id).addEventListener(id==='productSearch'?'input':'change',()=>{state.productLimit=75;renderProducts();});
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{const flag=b.dataset.filter;state.productFilter[flag]=!state.productFilter[flag];b.setAttribute('aria-pressed',String(state.productFilter[flag]));state.productLimit=75;renderProducts();}));
  $('receiptClear').addEventListener('click',()=>{for(const id of ['receiptSearch','receiptWarehouse','receiptMember','dateFrom','dateTo'])$(id).value='';$('receiptSort').value='newest';state.receiptFilter='';document.querySelectorAll('[data-receipt-filter]').forEach(b=>b.setAttribute('aria-pressed','false'));state.receiptLimit=50;renderReceipts();});
  $('productClear').addEventListener('click',()=>{for(const id of ['productSearch','productWarehouse','productMember'])$(id).value='';$('productSort').value='newest';state.productFilter={discount:false,markdown:false,refund:false};document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed','false'));state.productLimit=75;renderProducts();});
  $('renameReceiptMember').addEventListener('click',()=>{const member=$('receiptMember').value;if(!member){toast('Select a member from the dropdown first.');return;}rename('member',member);});
  $('itemMode').addEventListener('change',e=>{state.itemMode=e.target.value;state.productLimit=75;renderProducts();changed();});
  $('clearSaved').addEventListener('click',eraseArchive);
  renderAll();restoreArchive();
})();

</script>
